<style>
:root{
  color-scheme: light;
  --bg:#f3f5f9; --card:#ffffff; --ink:#15233b; --muted:#5d6b82; --line:#e1e6ef; --soft:#eef2f8;
  --brand:#1F3864; --brand2:#2E75B6; --ok:#2f7d32; --warn:#b8860b; --bad:#c0392b; --accent:#F0A868;
  --shadow:0 1px 2px rgba(20,40,80,.06),0 4px 14px rgba(20,40,80,.06);
  --r:16px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --bg:#0e1524; --card:#172134; --ink:#e7edf7; --muted:#9db0ca; --line:#29374f; --soft:#1d2a40;
    --brand:#8ab4e8; --brand2:#69a8e0; --ok:#7bc47f; --warn:#e0b44a; --bad:#ec7f72; --accent:#f3b27c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Aptos",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.bar{position:sticky;inset-block-start:0;z-index:20;background:var(--brand);color:#fff;padding-block-start:var(--safe-t)}
@media (prefers-color-scheme: dark){.bar{background:#13223d}}
.bar-in{max-inline-size:760px;margin-inline:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.bar h1{font-size:19px;letter-spacing:-.2px}
.bar p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.bar .grow{flex:1;min-inline-size:0}
.icon-btn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;min-inline-size:44px;block-size:44px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{inline-size:22px;block-size:22px}
.icon-btn[hidden]{display:none}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@media (prefers-reduced-motion: reduce){.icon-btn.spin svg,.spinner{animation:none}}
main{max-inline-size:760px;margin-inline:auto;padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 24px)}
main:focus{outline:none}
.tabs{position:fixed;inset-inline:0;inset-block-end:0;z-index:30;display:flex;background:var(--card);border-block-start:1px solid var(--line);padding-block-end:var(--safe-b);box-shadow:0 -2px 12px rgba(20,40,80,.06)}
.tabs button{flex:1;border:0;background:none;padding:8px 4px 6px;min-block-size:var(--nav-h);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.tabs button svg{inline-size:24px;block-size:24px}
.tabs button.on{color:var(--brand);font-weight:650}
@media (min-width:900px){.tabs{inset-inline:50%;transform:translateX(-50%);inline-size:760px;border-radius:16px 16px 0 0;border:1px solid var(--line)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-block-end:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-block-end:10px;font-weight:650}
.card .sub{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-inline-size:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.big{font-size:28px;font-weight:750;letter-spacing:-.5px;line-height:1.1}
.mid{font-size:20px;font-weight:700}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--soft);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:19px;font-weight:720;margin-block-start:2px}
.kpi .s{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;min-block-size:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0e1524}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand2)}
.btn.block{inline-size:100%}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block-end:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-block-size:36px;white-space:nowrap;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.chip.on{color:#0e1524}}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-block-size:38px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-block-end:1px solid var(--line);min-block-size:48px}
.li:last-child{border-block-end:0}
.li.tap{cursor:pointer}
.li .t{font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .d{font-size:12px;color:var(--muted)}
.li .a{font-weight:650;white-space:nowrap;text-align:end}
.dot{inline-size:10px;block-size:10px;border-radius:50%;flex:none}
.bar-track{block-size:8px;background:var(--soft);border-radius:999px;overflow:hidden;position:relative}
.bar-fill{block-size:100%;border-radius:999px}
.tick{position:absolute;inset-block:-3px;inline-size:2px;background:var(--ink);opacity:.55}
.field{display:flex;flex-direction:column;gap:4px;margin-block-end:12px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:560}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{inline-size:100%;min-block-size:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand2);outline-offset:1px}
input[type=range]{inline-size:100%;accent-color:var(--brand2);min-block-size:32px}
input[type=checkbox]{inline-size:22px;block-size:22px;accent-color:var(--brand2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slider-row{display:grid;grid-template-columns:12px minmax(0,1fr) 72px;gap:4px 10px;align-items:center;padding-block:6px;border-block-end:1px solid var(--line)}
.slider-row .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slider-row .cur{font-size:11.5px;color:var(--muted)}
.slider-row input[type=range]{grid-column:2 / 4}
.slider-row .val{text-align:end;font-weight:650}
.chart{inline-size:100%;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px}
.chart .lbl-strong{fill:var(--ink);font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-block-start:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ring-wrap{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note.warn{border-inline-start:4px solid var(--warn)}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,18,32,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-card{background:var(--card);inline-size:100%;max-inline-size:760px;max-block-size:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
.sheet-card h3{font-size:18px;margin-block-end:12px}
.sheet-actions{display:flex;gap:10px;margin-block-start:14px;position:sticky;inset-block-end:-18px;background:var(--card);padding-block:10px}
.sheet-actions .btn{flex:1}
.toast{position:fixed;inset-inline:16px;inset-block-end:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:60;margin-inline:auto;max-inline-size:520px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
details.acc{border-block-end:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 2px;font-weight:620;display:flex;justify-content:space-between;align-items:center;min-block-size:48px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-size:20px;color:var(--muted)}
details.acc[open]>summary::after{content:"\2212"}
details.acc .acc-in{padding:4px 2px 12px}
.wiz-steps{display:flex;gap:6px;margin-block-end:14px}
.wiz-steps i{flex:1;block-size:4px;border-radius:4px;background:var(--line)}
.wiz-steps i.on{background:var(--brand2)}
.hero{text-align:center;padding:18px 6px}
.hero .logo{inline-size:84px;block-size:84px;margin:0 auto 10px;display:block}
.hero h2{font-size:24px;margin-block-end:8px;color:var(--ink);text-transform:none;letter-spacing:-.3px}
.hero p{color:var(--muted);margin:0 0 6px}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.pill.warn{background:rgba(184,134,11,.14);color:var(--warn)}
.pill.ok{background:rgba(47,125,50,.14);color:var(--ok)}
.table{inline-size:100%;border-collapse:collapse;font-size:13.5px}
.table th,.table td{padding:8px 6px;border-block-end:1px solid var(--line);text-align:start}
.table td.n,.table th.n{text-align:end;white-space:nowrap}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0)}
.spinner{inline-size:22px;block-size:22px;border:3px solid var(--line);border-block-start-color:var(--brand2);border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

</style>

<script>
/* myFinances on FIRE · utilita' comuni (nessuna dipendenza esterna) */
"use strict";
const T = (typeof globalThis !== "undefined" ? globalThis : window).T = {};
T.APP = { name: "myFinances on FIRE", id: "myfinances-on-fire", version: "1.3.0", schema: 1 };

/* ---------- numeri e date ---------- */
T.round2 = v => Math.round(v * 100) / 100;
T.sum = a => a.reduce((s, v) => s + (+v || 0), 0);
T.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
T.pad = n => String(n).padStart(2, "0");
T.iso = d => d.getFullYear() + "-" + T.pad(d.getMonth() + 1) + "-" + T.pad(d.getDate());
T.today = () => T.iso(new Date());
T.parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
T.addDays = (s, n) => { const d = T.parseIso(s); d.setDate(d.getDate() + n); return T.iso(d); };
T.daysBetween = (a, b) => Math.round((T.parseIso(b) - T.parseIso(a)) / 864e5);
T.weekStart = s => { const d = T.parseIso(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return T.iso(d); };
T.monthKey = s => s.slice(0, 7);
T.DAYS_PER_MONTH = 365.25 / 12;

const MONTHS = {
  gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12,
  jan:1,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,dec:12,
  "mär":3,mrz:3,mai:5,okt:10,dez:12,
  janv:1,"févr":2,fevr:2,mars:3,avr:4,juin:6,juil:7,"août":8,aout:8,sept_:9,déc:12,dece:12
};
/* accetta: 2026-01-31, 2026-01-31 10:22:11, 31.01.2026, 31/01/2026, 31-01-2026, "1 gen 2026", "Jan 1, 2026" */
T.parseDate = (raw, hint) => {
  if (raw == null) return null;
  if (typeof raw === "number") {           // seriale Excel
    const d = new Date(Math.round((raw - 25569) * 864e5)); return T.iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + "-" + T.pad(m[2]) + "-" + T.pad(m[3]);
  m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
  if (m) {
    let d = +m[1], mo = +m[2], y = +m[3]; if (y < 100) y += 2000;
    if (hint === "mdy" || mo > 12) { const t = d; d = mo; mo = t; }
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return y + "-" + T.pad(mo) + "-" + T.pad(d);
  }
  m = s.toLowerCase().match(/^(\d{1,2})\.?\s+([a-zà-ü]+)\.?\s+(\d{4})/);
  if (m && MONTHS[m[2]] ) return m[3] + "-" + T.pad(MONTHS[m[2]]) + "-" + T.pad(m[1]);
  if (m && MONTHS[m[2].slice(0, 3)]) return m[3] + "-" + T.pad(MONTHS[m[2].slice(0, 3)]) + "-" + T.pad(m[1]);
  m = s.toLowerCase().match(/^([a-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if (m && MONTHS[m[1].slice(0, 3)]) return m[3] + "-" + T.pad(MONTHS[m[1].slice(0, 3)]) + "-" + T.pad(m[2]);
  return null;
};

/* importi: "-41,45 CHF", "1.234,56€", "CHF 2'700.00", "-1,234.56", "(12.00)" */
T.parseAmount = raw => {
  if (raw == null || raw === "") return null;
  if (typeof raw === "number") return raw;
  let s = String(raw).trim().replace(/\u2212/g, "-");
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[^0-9,.'\-+ ]/g, "").replace(/\s/g, "").replace(/'/g, "");
  if (s.startsWith("-")) { neg = !neg; s = s.slice(1); } else if (s.startsWith("+")) s = s.slice(1);
  if (s.endsWith("-")) { neg = !neg; s = s.slice(0, -1); }
  if (!s) return null;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (lc > -1) s = (s.length - lc - 1 === 3 && s.indexOf(",") !== lc) || (s.length - lc - 1 === 3 && lc > 0 && /^\d{1,3}(,\d{3})+$/.test(s)) ? s.replace(/,/g, "") : s.replace(",", ".");
  else if (ld > -1 && s.indexOf(".") !== ld) s = s.replace(/\./g, "");
  const v = parseFloat(s); if (!isFinite(v)) return null;
  return neg ? -v : v;
};
T.currencyOf = raw => {
  const s = String(raw || "");
  if (/€|EUR/.test(s)) return "EUR"; if (/\$|USD/.test(s)) return "USD"; if (/£|GBP/.test(s)) return "GBP";
  const m = s.match(/\b([A-Z]{3})\b/); return m ? m[1] : null;
};

/* testo con doppia codifica (UTF-8 letto come Windows-1252): "TitolaritÃ " -> "Titolarita'" */
const CP1252 = {"\u20ac":0x80,"\u201a":0x82,"\u0192":0x83,"\u201e":0x84,"\u2026":0x85,"\u2020":0x86,"\u2021":0x87,"\u02c6":0x88,"\u2030":0x89,"\u0160":0x8a,"\u2039":0x8b,"\u0152":0x8c,"\u017d":0x8e,"\u2018":0x91,"\u2019":0x92,"\u201c":0x93,"\u201d":0x94,"\u2022":0x95,"\u2013":0x96,"\u2014":0x97,"\u02dc":0x98,"\u2122":0x99,"\u0161":0x9a,"\u203a":0x9b,"\u0153":0x9c,"\u017e":0x9e,"\u0178":0x9f};
T.fixMojibake = s => {
  if (!s || !/[\u00c2-\u00f4][\u0080-\u00bf\u0152-\u2122]/.test(s)) return s;
  const bytes = [];
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if (c < 256) bytes.push(c); else if (CP1252[ch] != null) bytes.push(CP1252[ch]); else return s;
  }
  try { return new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes)); } catch (e) { return s; }
};

/* CSV RFC 4180, separatore automatico */
T.detectDelimiter = text => {
  const head = text.split(/\r?\n/).slice(0, 15).join("\n");
  let best = ",", n = -1;
  for (const d of [",", ";", "\t", "|"]) { const k = head.split(d).length; if (k > n) { n = k; best = d; } }
  return best;
};
T.parseCsv = (text, delim) => {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  delim = delim || T.detectDelimiter(text);
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
};

/* hash breve e stabile (FNV-1a 32 bit, due passate) per gli id dei movimenti */
T.hash = s => {
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ s.length;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822507); }
  return ((h1 >>> 0).toString(36) + (h2 >>> 0).toString(36));
};
T.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* nome esercente normalizzato per le regole */
T.normMerchant = s => String(s || "").toLowerCase()
  .replace(/https?:\/\/\S+/g, "").replace(/\*/g, " ").replace(/[0-9]{3,}/g, " ")
  .replace(/[^a-z0-9à-ü&' .-]/g, " ").replace(/\s+/g, " ").trim();

/* formattazione */
T.fmt = {
  cur: "CHF", locale: "de-CH",
  n0: v => new Intl.NumberFormat(T.fmt.locale, { maximumFractionDigits: 0 }).format(Math.round(v)),
  n1: v => new Intl.NumberFormat(T.fmt.locale, { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(v),
  n2: v => new Intl.NumberFormat(T.fmt.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v),
  money: v => T.fmt.n0(v) + " " + T.fmt.cur,
  money2: v => T.fmt.n2(v) + " " + T.fmt.cur,
  k: v => Math.abs(v) >= 1e6 ? T.fmt.n1(v / 1e6) + T.tr(" Mio") : Math.abs(v) >= 1e4 ? T.fmt.n0(v / 1e3) + "k" : T.fmt.n0(v),
  pct: v => T.fmt.n0(v * 100) + "%",
  pct1: v => T.fmt.n1(v * 100) + "%",
  date: s => { if (!s) return ""; const [y, m, d] = s.split("-"); const sep = T.LANG === "en" ? "/" : "."; return d + sep + m + sep + y; },
  dateShort: s => { if (!s) return ""; const [, m, d] = s.split("-"); return d + (T.LANG === "en" ? "/" : ".") + m; },
  month: k => { const [y, m] = k.split("-"); return T.monthNames()[+m - 1] + " " + y; },
  monthShort: k => T.monthNames()[+k.slice(5, 7) - 1].slice(0, 3)
};
T.MONTHS_IT = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

/* traduce un testo italiano; "~contesto" distingue chiavi uguali con significati diversi */
T.tr = (s, vars) => {
  if (typeof s !== "string" || !s) return s;
  let out;
  if (T.LANG === "it") out = s.indexOf("~") > 0 ? s.split("~")[0] : s;
  else {
    const d = T.DICT[T.LANG]; out = d ? d[s] : undefined;
    if (out === undefined) { out = s.indexOf("~") > 0 ? s.split("~")[0] : s; if (T._miss && /[a-zA-Z\u00c0-\u00ff]{3}/.test(s)) T._miss.add(s); }
  }
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m);
  return out;
};
T.detectLang = () => {
  try { for (const l of (navigator.languages || [navigator.language || ""])) { const c = String(l).slice(0, 2).toLowerCase(); if (T.LANGS.some(x => x[0] === c)) return c; } } catch (e) { }
  return "en";
};
T.setLang = (lang, currency) => {
  T.LANG = T.LANGS.some(x => x[0] === lang) ? lang : "it";
  const cur = currency || T.fmt.cur || "CHF";
  T.fmt.locale = cur === "CHF" ? T.LANG + "-CH" : ({ it: "it-IT", de: "de-DE", en: "en-GB" })[T.LANG];

};

T.relabel = (st, from, to) => {
  if (!st || from === to) return;
  const keys = Object.keys(T.DICT.en), back = {};
  for (const k of keys) { const v = from === "it" ? k.split("~")[0] : T.DICT[from] && T.DICT[from][k]; if (v && !(v in back)) back[v] = k; }

  (st.fixed || []).forEach(f => f.name = conv(f.name));

/* myFinances on FIRE · archivio locale (IndexedDB sul telefono), backup e ripristino */
"use strict";
(function () {
const DB = "myfinances-on-fire", LEGACY_DB = "traguardo", STORE = "kv", KEY = "state";
const clone = o => JSON.parse(JSON.stringify(o));

T.FIRE_DEFAULTS = {
  birthYear: null, investable: 0, cash: 0, equityShare: 0.9, market: "world", safeReturn: 0.01, inflation: 0.015,
  savingMode: "auto", monthlySaving: 0, savingGrowth: 0, spendMode: "auto", spendFire: 0,
  withdrawalRate: 0.035, strategy: "guardrail", band: 0.2, step: 0.1, floor: 0.8, taxRate: 0,
  pensions: [], lumps: [], endAge: 95, confidence: 0.85, sims: 2000, blockLen: 5
};
T.newState = () => ({
  app: T.APP.id, schema: T.APP.schema,
  profile: { name: "", lang: T.LANG, currency: "CHF", locale: "de-CH", incomeMonthly: 0, fx: { EUR: 0.94, USD: 0.80, GBP: 1.07 }, onboarded: false, demo: false, created: T.today() },
  categories: clone(T.DEFAULT_CATEGORIES).map(c => Object.assign(c, { name: T.tr(c.name), budget: 0 })),
  rules: [], txs: [], vacations: [], fixed: [],
  budget: { preset: "attuale", vacationYear: 0, investMonthly: 0 },
  fire: clone(T.FIRE_DEFAULTS),
  csvProfiles: [], imports: [], meta: { lastBackup: null, lastSaved: null }, bank: T.bankDefaults()
});

/* migrazioni future: ogni versione dello schema aggiunge un passo */
T.migrate = st => {
  if (st.profile && !st.profile.lang) st.profile.lang = "it";   /* dati creati prima delle lingue */
  const base = T.newState();
  for (const k of Object.keys(base)) if (st[k] == null) st[k] = base[k];
  st.profile = Object.assign(base.profile, st.profile);
  st.fire = Object.assign(clone(T.FIRE_DEFAULTS), st.fire);
  st.budget = Object.assign(base.budget, st.budget);
  st.bank = Object.assign(T.bankDefaults(), st.bank || {});
  st.schema = T.APP.schema;
  return st;
};

/* backend: IndexedDB, poi localStorage, poi memoria (test) */
function idb(name) {
  return new Promise((res, rej) => {
    if (typeof indexedDB === "undefined") return rej(new Error("no idb"));
    const r = indexedDB.open(name || DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const mem = {};
T.storage = {
  async get() {
    const read = async name => { const db = await idb(name); return await new Promise((res, rej) => { const q = db.transaction(STORE).objectStore(STORE).get(KEY); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); };
    try {
      const v = await read(DB); if (v) return v;
      /* dati salvati con il nome precedente dell'app (Traguardo): vengono ripresi */
      try { return await read(LEGACY_DB); } catch (e) { return null; }
    }
    catch (e) { try { const s = localStorage.getItem(DB + ":" + KEY) || localStorage.getItem(LEGACY_DB + ":" + KEY); return s ? JSON.parse(s) : null; } catch (e2) { return mem[KEY] ? clone(mem[KEY]) : null; } }
  },
  async set(v) {
    try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(v, KEY); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
    catch (e) { try { localStorage.setItem(DB + ":" + KEY, JSON.stringify(v)); } catch (e2) { mem[KEY] = clone(v); } }
  },
  async clear() {
    try { const db = await idb(); await new Promise(res => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).delete(KEY); tx.oncomplete = res; tx.onerror = res; }); } catch (e) { }
    try { localStorage.removeItem(DB + ":" + KEY); } catch (e) { } delete mem[KEY];
  },
  async persist() { try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) { } return false; }
};
T.load = async () => { const s = await T.storage.get(); return s ? T.migrate(s) : null; };
let saveTimer = null;
T.save = (st, now) => {
  st.meta.lastSaved = new Date().toISOString();
  clearTimeout(saveTimer);
  if (now) return T.storage.set(st);
  return new Promise(res => { saveTimer = setTimeout(() => T.storage.set(st).then(res), 250); });
};

/* backup: un solo file JSON, leggibile, che contiene tutto */
T.makeBackup = st => ({ app: T.APP.id, kind: "backup", schema: T.APP.schema, version: T.APP.version, exported: new Date().toISOString(), state: st });
T.readBackup = obj => {
  if (!obj || !(obj.app === T.APP.id || obj.app === "traguardo") || !obj.state) throw new Error(T.tr("Questo file non e' un backup di ") + T.APP.name);
  if ((obj.schema || 1) > T.APP.schema) throw new Error(T.tr("Il backup arriva da una versione piu' recente dell'app: aggiorna l'app e riprova"));
  const st = T.migrate(obj.state);
  if (!Array.isArray(st.txs) || !Array.isArray(st.categories)) throw new Error(T.tr("Backup incompleto"));
  return st;
};
})();

   Nessuna libreria esterna: zip e deflate con DecompressionStream del browser. */
"use strict";
(function () {
const td = new TextDecoder("utf-8");

async function inflate(bytes, raw) {
  const ds = new DecompressionStream(raw ? "deflate-raw" : "deflate");
  const out = new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return new Uint8Array(await out.arrayBuffer());
}
T.inflate = inflate;

/* ---------- ZIP ---------- */
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error(T.tr("Il file non e' un archivio valido"));
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const loc = dv.getUint32(p + 42, true);

    p += 46 + nl + el + cl;
  }

    names: Object.keys(files),
    async text(name) {
      const f = files[name]; if (!f) return null;
      const lnl = dv.getUint16(f.loc + 26, true), lel = dv.getUint16(f.loc + 28, true);
      const start = f.loc + 30 + lnl + lel, data = u8.subarray(start, start + f.csize);

const xmlDecode = s => s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-f]+);/gi, (m, e) =>
  e === "lt" ? "<" : e === "gt" ? ">" : e === "amp" ? "&" : e === "quot" ? '"' : e === "apos" ? "'" :
  String.fromCodePoint(e[1] === "x" || e[1] === "X" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10)));

/* restituisce [{name, rows:[[cella,...],...]}] con valori testo o numero */
T.readXlsx = async buf => {
  const z = await unzip(buf);
  const ss = [];
  const sst = await z.text("xl/sharedStrings.xml");
  if (sst) for (const m of sst.matchAll(/<si>([\s\S]*?)<\/si>/g)) {
    let t = ""; for (const x of m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) t += x[1];
    ss.push(xmlDecode(t));
  }
  const wb = (await z.text("xl/workbook.xml")) || "";
  const rels = (await z.text("xl/_rels/workbook.xml.rels")) || "";
  const sheets = [];
  for (const m of wb.matchAll(/<sheet\b[^>]*?name="([^"]*)"[^>]*?r:id="([^"]*)"/g)) {
    const rel = rels.match(new RegExp('Id="' + m[2] + '"[^>]*Target="([^"]+)"')) || rels.match(new RegExp('Target="([^"]+)"[^>]*Id="' + m[2] + '"'));
    let path = rel ? rel[1] : null; if (!path) continue;
    path = path.replace(/^\//, ""); if (!path.startsWith("xl/")) path = "xl/" + path;
    sheets.push({ name: xmlDecode(m[1]), path });
  }
  if (!sheets.length) z.names.filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).forEach(p => sheets.push({ name: p, path: p }));
  const out = [];
  for (const sh of sheets) {
    const xml = await z.text(sh.path); if (!xml) continue;
    const rows = [];
    for (const r of xml.matchAll(/<row\b[^>]*?(?:r="(\d+)")?[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)) {
      const ri = r[1] ? +r[1] - 1 : rows.length, row = [];
      if (r[2]) for (const c of r[2].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const attrs = c[1], body = c[2] || "";
        const ref = (attrs.match(/r="([A-Z]+\d+)"/) || [])[1];
        const t = (attrs.match(/t="(\w+)"/) || [])[1];
        let v = null;
        if (t === "inlineStr") { v = ""; for (const x of body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) v += xmlDecode(x[1]); }
        else { const vm = body.match(/<v>([\s\S]*?)<\/v>/); if (vm) v = t === "s" ? ss[+vm[1]] : t === "str" || t === "e" ? xmlDecode(vm[1]) : t === "b" ? vm[1] === "1" : +vm[1]; }

      }
      rows[ri] = row;

T.weeksHistory = (st, n, lastStart) => { const out = []; for (let i = n - 1; i >= 0; i--) { const s = T.addDays(lastStart, -7 * i); const w = T.week(st, s); out.push({ start: s, spent: w.spent, vac: w.vac, cap: w.cap }); } return out; };

/* myFinances on FIRE · simulatore FIRE Monte Carlo (tutti gli importi in moneta di oggi) */
"use strict";
(function () {
T.MARKET_PROFILES = {
  world:      { label: "Azionario mondiale, sequenze dal 1972", from: 1972, gap: 1.3, mix: 0 },
  world_long: { label: "Azionario mondiale, sequenze dal 1928", from: 1928, gap: 0.2, mix: 0 },
  usa:        { label: "Solo S&P 500, dal 1972",                 from: 1972, gap: 0, mix: 0 },
  tech:       { label: "Tecnologia (50% Nasdaq 100 + 50% S&P 500), dal 1986", from: 1986, gap: 0, mix: 0.5, nas: "NDX100" }
};
/* rendimenti azionari nominali annui del profilo */
T.marketSeries = key => {
  const P = T.MARKET_PROFILES[key] || T.MARKET_PROFILES.world, M = T.MARKET;
  const nas = P.nas ? M[P.nas] : null;
  return Object.keys(M.SP500).map(Number).filter(y => y >= P.from && (!nas || y in nas)).sort((a, b) => a - b)
    .map(y => ((nas ? P.mix * nas[y] + (1 - P.mix) * M.SP500[y] : M.SP500[y]) - P.gap) / 100);
};
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const q = (s, p) => { if (!s.length) return 0; const i = (s.length - 1) * p, b = Math.floor(i), r = i - b; return s[b + 1] !== undefined ? s[b] + r * (s[b + 1] - s[b]) : s[b]; };

/* parametri effettivi: "auto" prende spesa e risparmio dall'app */
T.fireInputs = (st, override) => {
  const f = Object.assign({}, st.fire, override || {});
  const pic = T.picture(st);
  const yearNow = new Date().getFullYear();
  const age = f.birthYear ? yearNow - f.birthYear : 40;
  const spendBase = override && override.useBudget ? pic.plan.total : pic.now.total;
  const spend = f.spendMode === "auto" ? spendBase : +f.spendFire || 0;
  const income = pic.income;
  /* il risparmio automatico (3a ecc.) non e' una spesa: e' gia' dentro reddito meno spese */
  const saving = f.savingMode === "auto" ? Math.max(0, income - (override && override.useBudget ? pic.plan.total : pic.habitsNext)) : +f.monthlySaving || 0;
  return { f, age, spend, saving, income, pic };
};

/* simulazione: per ogni eta' di ritiro, quota di scenari in cui il patrimonio basta fino a endAge */
T.simulateFire = (st, override) => {
  const { f, age, spend, saving } = T.fireInputs(st, override);
  const infl = +f.inflation || 0, eq = T.clamp(+f.equityShare, 0, 1);
  const safeReal = (1 + (+f.safeReturn || 0)) / (1 + infl) - 1;
  const endAge = Math.max(age + 5, +f.endAge || 95), years = endAge - age;
  const sims = Math.max(200, Math.min(5000, +f.sims || 2000));
  const series = T.marketSeries(f.market), L = Math.max(1, +f.blockLen || 5);
  const rand = rng(12345 + (override && override.seed || 0));
  /* rendimenti reali annui di portafoglio, gli stessi per tutte le eta' (confronto equo) */
  const R = new Float64Array(sims * years);
  for (let s = 0; s < sims; s++) {
    let k = 0;
    while (k < years) { const st0 = Math.floor(rand() * series.length); for (let j = 0; j < L && k < years; j++, k++) { const re = (1 + series[(st0 + j) % series.length]) / (1 + infl) - 1; R[s * years + k] = eq * re + (1 - eq) * safeReal; } }
  }
  const W0 = (+f.investable || 0) + (+f.cash || 0);
  const pensions = (f.pensions || []).filter(p => +p.monthly > 0), lumps = (f.lumps || []).filter(l => +l.amount);
  const tax = T.clamp(+f.taxRate || 0, 0, 0.6), g = +f.savingGrowth || 0;
  /* tabelle per anno: pensioni, capitali in arrivo, risparmio */
  const PEN = new Float64Array(years + 1), LUMP = new Float64Array(years + 1), SAV = new Float64Array(years + 1);
  for (let k = 0; k <= years; k++) {
    const a = age + k;
    PEN[k] = T.sum(pensions.filter(p => a >= +p.age).map(p => +p.monthly * 12));
    LUMP[k] = T.sum(lumps.filter(l => +l.age === a + 1).map(l => +l.amount));
    SAV[k] = saving * 12 * Math.pow(1 + g, k);
  }
  const guard = f.strategy === "guardrail", band = +f.band || 0.2, step = +f.step || 0.1, floor = +f.floor || 0.8;
  const maxR = Math.min(endAge - 1, Math.max(age + 1, 70));
  const ages = []; for (let a = age; a <= maxR; a++) ages.push(a);
  function run(s, retireAge, keep) {
    let W = W0, wd0 = 0, wd = 0, wr0 = 0, path = keep ? new Float64Array(years + 1) : null, minSpend = 1;
    if (path) path[0] = W;
    for (let k = 0; k < years; k++) {
      const a = age + k, r = R[s * years + k];
      if (a < retireAge) W = W * (1 + r) + SAV[k];
      else {
        const need = Math.max(0, spend * 12 - PEN[k]);
        if (a === retireAge) { wd0 = need; wd = need; wr0 = W > 0 ? need / W : 1; }
        else if (guard && W > 0 && wr0 > 0) {
          const wr = wd / W;
          if (wr > wr0 * (1 + band)) wd = Math.max(wd * (1 - step), floor * wd0);
          else if (wr < wr0 * (1 - band)) wd = Math.min(wd * (1 + step), wd0 * 1.25);
          const base = Math.max(0, spend * 12 - PEN[k]);
          if (base < wd0) { wd = wd * (base / Math.max(1, wd0)); wd0 = base; }
        } else wd = need;
        if (wd0 > 0) minSpend = Math.min(minSpend, wd / wd0);
        W = (W - wd / (1 - tax)) * (1 + r);
      }
      W += LUMP[k];
      if (path) path[k + 1] = W;
      if (W < 0) { if (path) for (let j = k + 2; j <= years; j++) path[j] = 0; return { ok: false, W: 0, path, depleteAge: a + 1, minSpend }; }
    }
    return { ok: true, W, path, minSpend };
  }
  const prob = ages.map(ra => { let ok = 0; for (let s = 0; s < sims; s++) if (run(s, ra).ok) ok++; return ok / sims; });
  const conf = T.clamp(+f.confidence || 0.85, 0.5, 0.99);
  /* eta' FIRE: prima eta' in cui la probabilita' supera la soglia, interpolata */
  let fireAge = null;
  for (let i = 0; i < ages.length; i++) if (prob[i] >= conf) { fireAge = i === 0 ? ages[0] : ages[i - 1] + (conf - prob[i - 1]) / Math.max(1e-9, prob[i] - prob[i - 1]); break; }
  const target = fireAge != null ? Math.ceil(fireAge - 1e-9) : maxR;
  const chosen = override && override.retireAge ? +override.retireAge : target;
  /* bande del patrimonio per l'eta' scelta */
  const paths = []; let okN = 0, cuts = [];
  for (let s = 0; s < sims; s++) { const r = run(s, chosen, true); paths.push(r.path); if (r.ok) okN++; cuts.push(r.minSpend); }
  const bands = [];
  for (let k = 0; k <= years; k++) { const col = paths.map(p => p[k]).sort((a, b) => a - b); bands.push({ age: age + k, p10: q(col, 0.1), p25: q(col, 0.25), p50: q(col, 0.5), p75: q(col, 0.75), p90: q(col, 0.9) }); }
  cuts.sort((a, b) => a - b);
  const fireNumber = spend * 12 / (+f.withdrawalRate || 0.035);
  return { age, ages, prob, conf, fireAge, chosen, successChosen: okN / sims, bands, fireNumber, progress: fireNumber > 0 ? W0 / fireNumber : 0,
    spend, saving, W0, years, sims, worstCut: guard ? 1 - q(cuts, 0.1) : 0, profile: (T.MARKET_PROFILES[f.market] || T.MARKET_PROFILES.world).label };
};
})();

"use strict";
(function () {
T.BANK_DEFAULTS = { url: "", token: "", country: "LT", aspsp: "Revolut", session: null, validUntil: null, accounts: [],
  lastSync: null, lastResult: null, lastError: null, auto: true, pendingState: null, cursors: {} };
T.bankDefaults = () => JSON.parse(JSON.stringify(T.BANK_DEFAULTS));
T.randomToken = n => { const b = new Uint8Array(n || 32); crypto.getRandomValues(b); let s = ""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
T.bankConnected = st => !!(st.bank && st.bank.session && st.bank.accounts && st.bank.accounts.length);
T.bankExpired = st => !!(st.bank && st.bank.validUntil && Date.parse(st.bank.validUntil) < Date.now());

T.bankErrorText = (status, d) => {
  const e = (d && d.error) || "", det = String((d && (d.detail || d.message)) || "");
  if (status === 401 || e === "unauthorized") return T.tr("Il codice di accesso non corrisponde a quello impostato nel ponte (APP_TOKEN).");
  if (e === "origin_not_allowed") return T.tr("Il ponte non accetta richieste da questo indirizzo: controlla ALLOWED_ORIGIN.");
  if (/EXPIRED|REVOKED|CLOSED|INVALID_SESSION|SESSION_NOT|access.?expired|consent/i.test(det)) return T.tr("Il consenso Revolut e' scaduto o e' stato revocato: ricollega Revolut.");
  if (/REDIRECT/i.test(det)) return T.tr("L'indirizzo di ritorno non e' registrato su Enable Banking: controlla REDIRECT_URL e gli Allowed redirect URLs.");
  if (/NOT_ACTIVE|inactive|not active|NOT_ACTIVATED/i.test(det)) return T.tr("L'applicazione Enable Banking non e' ancora attiva: collega il tuo conto dal Control Panel.");
  if (/kid|JWT|signature|token/i.test(det)) return T.tr("Enable Banking non riconosce la firma: controlla EB_APP_ID e EB_PRIVATE_KEY nel ponte.");
  if (e === "bank_not_found") return T.tr("Revolut non e' disponibile per il paese scelto: prova un altro paese.");
  if (status === 429 || /TOO_MANY|rate/i.test(det)) return T.tr("Troppe richieste alla banca: riprova tra qualche ora.");
  return T.tr("Errore ") + status + (e ? " (" + e + ")" : "") + (det ? ": " + det.slice(0, 180) : "");
};
T.bankCall = async (st, path, body) => {
  const B = st.bank;
  if (!B || !B.url || !B.token) throw new Error(T.tr("Il ponte non e' configurato: inserisci indirizzo e codice di accesso."));
  let r;
  try { r = await fetch(B.url.trim().replace(/\/+$/, "") + path, { method: "POST", headers: { "Authorization": "Bearer " + B.token.trim(), "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); }

/* movimento Enable Banking -> riga di import */
T.mapEbTx = (t, acc) => {
  const ta = t.transaction_amount || {}, x = parseFloat(ta.amount);
  if (!isFinite(x)) return null;
  const ind = t.credit_debit_indicator;
  const amt = ind === "DBIT" ? -Math.abs(x) : ind === "CRDT" ? Math.abs(x) : x;
  const d = T.parseDate(t.transaction_date || t.booking_date || t.value_date); if (!d) return null;
  const party = amt < 0 ? t.creditor && t.creditor.name : t.debtor && t.debtor.name;
  const rem = (t.remittance_information || []).filter(s => s && !/^RF\d{2}|^\d{8,}$/.test(String(s).trim())).join(" ").trim();
  const btc = t.bank_transaction_code || {}, code = String(btc.description || btc.code || "");
  const desc = String(party || rem || t.note || code || "Movimento").replace(/\s+/g, " ").trim();
  const c = (code + " " + rem + " " + desc).toLowerCase();
  const rcat = /exchange|conversion|cambio valuta|conversione/.test(c) ? "Cambio valuta"
    : /top.?up|ricarica|aufladung/.test(c) ? "Ricarica"
    : /\batm\b|cash withdrawal|prelievo/.test(c) ? "Prelievo"
    : /refund|rimborso|rückerstattung/.test(c) || (amt > 0 && t.merchant_category_code) ? "Rimborso"
    : t.merchant_category_code || /card/.test(c) ? "Esercente" : "";
  const ref = t.transaction_id || t.entry_reference || null;
  return { d, desc, rcat, amtLoc: T.round2(amt), cur: ta.currency || acc.currency || "", amt: null, fee: 0,
    acct: acc.name ? acc.name + (acc.currency ? " (" + acc.currency + ")" : "") : "Revolut " + (acc.currency || ""),
    pending: t.status === "PDNG", fixedId: ref ? T.hash("revolut-api|" + acc.uid + "|" + ref) : null };
};

/* scarica i movimenti nuovi di tutti i conti collegati */
T.bankSync = async (st, opt) => {
  opt = opt || {};
  const B = st.bank;
  if (!T.bankConnected(st)) throw new Error(T.tr("Revolut non e' collegato."));
  if (T.bankExpired(st)) throw new Error(T.tr("Il consenso Revolut e' scaduto: ricollega Revolut."));
  const today = T.today(), rows = [];
  const fam = st.txs.filter(t => /^revolut/.test(t.src || "") && !t.pending).map(t => t.d).sort();
  const lastKnown = fam.length ? fam[fam.length - 1] : null;
  for (const acc of B.accounts) {
    let from = opt.from || (B.cursors[acc.uid] ? T.addDays(B.cursors[acc.uid], -10) : lastKnown ? T.addDays(lastKnown, -10) : T.addDays(today, -89));
    if (from > today) from = today;
    let key = null, pages = 0, maxBooked = B.cursors[acc.uid] || null;
    do {
      const d = await T.bankCall(st, "/transactions", { account_uid: acc.uid, date_from: from, continuation_key: key || undefined });
      for (const t of (d && d.transactions) || []) {
        const r = T.mapEbTx(t, acc); if (!r) continue;
        rows.push(r);
        if (!r.pending && (!maxBooked || r.d > maxBooked)) maxBooked = r.d;
      }
      key = (d && d.continuation_key) || null; pages++;
    } while (key && pages < 40);
    if (maxBooked) B.cursors[acc.uid] = maxBooked > today ? today : maxBooked;
  }
  /* i movimenti in sospeso vengono sostituiti a ogni aggiornamento, conservando le modifiche fatte a mano */
  const old = {};
  st.txs = st.txs.filter(t => { if (t.src === "revolut-api" && t.pending) { old[t.id] = t; return false; } return true; });
  const res = T.mergeTxs(st, rows, "revolut-api");
  let back = 0;
  for (const t of st.txs) {
    const o = old[t.id]; if (!o) continue; back++;
    if (o.manual || o.note || o.vac != null) ["manual", "flow", "cat", "kind", "note", "vac"].forEach(k => { if (o[k] !== undefined) t[k] = o[k]; });
  }
  B.lastSync = new Date().toISOString(); B.lastError = null;
  B.lastResult = { added: Math.max(0, res.added - back), dup: res.dup, pending: st.txs.filter(t => t.src === "revolut-api" && t.pending).length, received: rows.length, noFx: res.noFx };
  return B.lastResult;
};
})();

/* h("div.card#id", {attr}, figli...) */
T.h = (sel, attrs, ...kids) => {

  const el = document.createElement(m[1] || "div");
  (m[2] || "").replace(/([.#])([\w-]+)/g, (x, t, v) => { if (t === ".") el.classList.add(v); else el.id = v; return x; });
  if (attrs && (typeof attrs !== "object" || attrs.nodeType || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  for (const k in attrs || {}) {

    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);

T.ring = (pct, main, sub, color) => {

/* colonne (anche impilate) con linea di riferimento */

/* ciambella */
T.donut = (items, center, sub) => {
  const s = svgBox(180, 180, "composizione"), tot = T.sum(items.map(i => Math.max(0, i.v))) || 1;

T.fanChart = (host, bands, opt) => {

  T.$("sheet").addEventListener("click", e => { if (e.target === T.$("sheet")) T.closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") T.closeSheet(); });
  let rt = null; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (T.$("sheet").hidden) A.render(); }, 200); });
  /* file condivisi verso l'app (Android "Condividi" o "Apri con") */
  if ("launchQueue" in window && window.launchQueue) window.launchQueue.setConsumer(async p => { for (const fh of p.files || []) { const f = await fh.getFile(); A.importFile({ name: f.name, buf: await f.arrayBuffer() }); } });
  A.go("home", null, true);
  /* ritorno dal consenso Revolut: ?code=...&state=... */
  let qs = null; try { qs = new URLSearchParams(location.search); } catch (e) { }
  if (qs && (qs.has("code") || qs.has("error"))) { try { history.replaceState(null, "", location.pathname); } catch (e) { } await A.finishConnect(qs); }
  else A.autoSync();
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); A.installPrompt = e; });
if ("serviceWorker" in navigator && /^https:$|^http:$/.test(location.protocol) && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => { const nw = reg.installing; if (!nw) return; nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) T.toast(T.tr("Nuova versione installata: riapri l'app per usarla")); }); });
  }).catch(() => { });
}
start().catch(e => { console.error(e); const v = T.$("view"); if (v) v.textContent = T.tr("Errore all'avvio: ") + (e.message || e); });
})();

</script>
